<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="userUpdate.css"></script>
</head>
<body>

    <h1>Staff Update</h1>
    <div class="Update">
        <form id="loginForm">
            <input type="text"  placeholder="Name" id="employeeName">
            <br>
            <input type="text"  placeholder="Username" id="userName">
            <br>
            <input type="email"  placeholder="Email" id="email">
            <br>
            <input type="number"  placeholder="Phone Number" id="phoneNumber">
            <br>
            <input type="text"  placeholder="Company name" id="companyName">
            <br>
            <input type="text"  placeholder="Catchphrase" id="catchPhrase">
            <br>
            <input type="text"  placeholder="Street" id="street">
            <br>
            <input type="text"  placeholder="Suite" id="suite">
            <br>
            <input type="text"  placeholder="City" id="city">
            <br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        
        </form>
    </div>

    <table>
        <thead>
        <tr>
            <th>Employee name</th>
            <th>Username</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th>Company Name</th>
            <th>Catch Phrase</th>
            <th>Street</th>
            <th>Suite</th>
            <th>City</th>
        </tr>
        </thead>
        <tbody>

            
        </tbody>

    </table>
<script src="form.js"></script>
</body>
</html>
