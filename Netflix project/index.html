<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="navBar">
        <img class="logo" src="./netflix.png">
        <h1 id="N">NETFLIX</h1>
        <p>Movies</p>
        <p>TV Shows</p>
        <p>People</p>
        <p>Awards</p>
        <p>More</p>
        <!-- an icon to add to collection, a selector for language, a notification icon, profile picture and search icon.  -->
        <img src="./add.png">
        <div class="lang">
            <label for="language-select">Choose a language:</label>
            <select id="language-select" name="language">
                <option value="en">English</option>
                <option value="es">Español (Spanish)</option>
                <option value="fr">Français (French)</option>
                <option value="de">Deutsch (German)</option>
                <option value="zh">中文 (Chinese)</option>
            </select>
        </div>
        <img src="./notis.png">
        <img src="">
        <img src="./search.png">

    </div>


    <div class="hook">
        <!-- add a image background to this div that changes every 5 seconds -->
        <span>Welcome</span>
        <span>Millions of movies, TV shows and people to discover. Explore now.</span>
    </div>

    <div class="timeFrame"></div>
    <h2>Trending</h2>
    <p>Today</p>
    <p>This Week</p>
    </div>

</body>

</html>
