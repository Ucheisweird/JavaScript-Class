<body>
    <script>
        let day = prompt('Enter A Day').toLowerCase().trim()
        if (day === 'sunday'){
            console.log('Go to Church');
            
        }else if (day === 'monday'){
            console.log('Go to Work');

        }else if (day === 'tuesday'){
            console.log('Watch Ucl');
        }
        else if (day === 'wednesday'){
            console.log('Watch Laliga');
        }
         else if (day === 'Thursday'){
            console.log('Watch Europa');

        } else if (day === 'friday'){
            console.log('Go to Mosque');
        }
         else if (day === 'saturday'){
            console.log('laundry day');
        }
        else{
            console.log('Please enter a valid day');
        }
    </script>
</body>
