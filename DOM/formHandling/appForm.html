<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./appForm.css">
    <script src="./appForm.js" ></script>
</head>
<body>
    <form name="contactForm" method="post" onsubmit="return validateForm()" action="confirmation.php">
    <h2>Application form</h2>
    <div class="row">
        <label for="">Full name</label> 
        <input type="text" name="name" id="">
        <div class="error" id="nameErr"></div>
    </div>
    <div class="row">
        <label for="">Email Address</label>
        <input type="text" name="email">
        <div class="error" id="emailErr"></div>
    </div>
    <div class="row">
        <label for="">Mobile Number</label>
        <input type="text" name="mobile" maxlength="10">
        <div class="error" id="mobileErr"></div>
    </div>
    <div class="row">
        <label for="">Country</label>
        <select name="country" >
            <option value="">Select</option>
            <option value="">Australia</option>
            <option value="">India</option>
            <option value="">United States</option>
            <option value="">United Kingdom</option>
        </select>
        <div class="error" id="countryErr"></div>
    </div>
    <div class="row">
        <label for="">Gender</label>
        <div class="form-inline">
            <label for=""><input type="radio" name="gender" value="male">Male</label>
            <label for=""><input type="radio" name="gender" value="female">Female</label>
        </div>
        <div class="error" id="genderErr"></div>
    </div>
    <div class="row">
        <label for="">Hobbies <i>(optional)</i></label>
        <div class="form-inline">
            <label for=""><input type="checkbox" name="hobbies[]" id="" value="sports">Sports</label>
            <label for=""><input type="checkbox" name="hobbies[]" id="" value="movies">Movies</label>
            <label for=""><input type="checkbox" name="hobbies[]" id="" value="music">Music</label>
        </div>
    </div>
    <div class="row">
        <input type="submit" value="Submit">
    </div>

</form>
</body>
</html>
