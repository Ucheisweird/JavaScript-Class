<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="input" id="myInput" placeholder="Enter a Name">
    <a href="https://www.bbc.com" target="_blank" download="true">BBC</a>
    <script>
        let inpEle = document.getElementById('myInput') //getting element by id
        let placeHolderValue = inpEle.getAttribute('placeholder') //getting placeholder
        console.log(placeHolderValue); //enter a name
        //getting anchor element
        let anc = document.getElementsByTagName('a')
        let ancHref = anc[0].getAttribute('href')
        console.log(ancHref);
    </script>
</body>
</html>
